[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrive-jepa-robustness"
version = "0.1.0"
description = "Natural corruption-aware masked JEPA for driving images"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
